  <div class="perfil-container">

    <div class="perfil-card">

        <div class="perfil-topo">

            <img
            src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png"
            alt="Usuário">

            <h2>Vitor Hugo</h2>

            <span>Pessoa PCD</span>

        </div>

        <form id="perfilForm">

            <div class="input-group">

                <label>Nome Completo</label>

                <input
                type="text"
                id="nome"
                value="Vitor Hugo">

            </div>

            <div class="input-group">

                <label>E-mail</label>

                <input
                type="email"
                id="email"
                value="vitor@email.com">

            </div>

            <div class="input-group">

                <label>Telefone</label>

                <input
                type="text"
                id="telefone"
                value="(11) 99999-9999">

            </div>

            <div class="input-group">

                <label>CPF</label>

                <input
                type="text"
                id="cpf"
                value="000.000.000-00">

            </div>

            <button type="submit">
                Salvar Alterações
            </button>

        </form>

    </div>

</div>
